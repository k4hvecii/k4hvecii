name: Refresh K4 Profile Stats

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths:
      - "assets/profile/profile.template.svg"
      - "data/profile.json"
      - "data/systems.json"
      - "data/projects.json"
      - "data/stack.json"
      - "scripts/render-profile.py"
      - ".github/workflows/profile-stats.yml"

permissions:
  contents: write

concurrency:
  group: k4-profile-stats
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Render profile and stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/render-profile.py

      - name: Commit refreshed profile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile/profile.svg data/github-stats.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh K4 profile data"
            git pull --rebase --autostash origin main
            git push
          else
            echo "Profile data is already current."
          fi
